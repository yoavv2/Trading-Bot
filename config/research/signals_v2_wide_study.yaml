# Protocol of the second signals study (docs/SIGNALS-PLAN.md, Step 1 status and section 5).
#
# Written on 2026-11-19 before any run on these assets. The owner fixed the asset rule and
# the windows the same day; the only step taken before writing this file was downloading
# the bars and checking their coverage. `scripts/run_signals_v2_study.py` reads this file,
# records its SHA-256 with the results, and refuses to run a second time into the same
# output directory. Changing anything here after a run is a new study.

name: signals-v2-wide-2026-11-19

# The same four rule sets and the same base risk block as the first study
# (stop 5%, target 2R, minimum reward-to-risk 1.5): config/research/examples_v2/.
versions:
  - trend_following_daily
  - rsi_mean_reversion_daily
  - donchian_breakout_daily
  - time_series_momentum_daily

# The asset rule, fixed before any result was seen:
#   1. the 30 members of the Dow Jones Industrial Average on 2015-01-02, the first session
#      of the study range (not today's members, so later winners are not picked);
#   2. SPY, IWM, DIA and the nine sector funds that traded before 2014.
# A company is listed under the ticker its listing carries today: United Technologies
# (UTX) is RTX. DD is Tiingo's series for today's DuPont de Nemours, which continues
# through the 2017 Dow merger and the 2019 separation.
# An asset without a Tiingo bar on every session from 2014-01-02 to 2026-10-07 would have
# been dropped and named here. None was.
# The five assets of the first study (NVDA, PLTR, QQQ, SMCI, URA) are not on the list.
assets:
  # Dow Jones Industrial Average, 2015-01-02
  - MMM
  - AXP
  - T
  - BA
  - CAT
  - CVX
  - CSCO
  - KO
  - DD
  - XOM
  - GE
  - GS
  - HD
  - INTC
  - IBM
  - JNJ
  - JPM
  - MCD
  - MRK
  - MSFT
  - NKE
  - PFE
  - PG
  - TRV
  - UNH
  - RTX
  - V
  - VZ
  - WMT
  - DIS
  # Index and sector funds
  - SPY
  - IWM
  - DIA
  - XLB
  - XLE
  - XLF
  - XLI
  - XLK
  - XLP
  - XLU
  - XLV
  - XLY

data:
  provider: tiingo
  adjusted: true
  # Bars before `range.start` are read as indicator history only (253 sessions at most).
  history_from: 2014-01-02

range: {start: 2015-01-02, end: 2026-10-07}

# Selection reads development and validation. The holdout is the last two years; it is
# run once, for one version, after the selection is fixed. No run on these assets has
# seen it. The same calendar period was seen in the first study on five other assets
# (its validation year for all four versions, its holdout year for the Donchian breakout),
# so the holdout is new for the assets and not for the market.
windows:
  development: {start: 2015-01-02, end: 2022-10-06}
  validation: {start: 2022-10-07, end: 2024-10-04}
  holdout: {start: 2024-10-07, end: 2026-10-07}

# One asset per run, the whole capital in each trade. R does not depend on the size.
initial_capital: 100000
quantity_policy: fractional
costs:
  slippage_bps: 5 # against the trade, on every entry and every exit
  commission_per_order: 1 # USD

# A version is judged on the pool of its trades across the 42 assets, in net R, with the
# stop assumed first on every bar that touched both levels. The values are those of the
# first study; the profitable-asset count keeps its ratio (3 of 5 there, 60%).
criteria:
  min_closed_trades_development: 30
  min_closed_trades_validation: 10
  # also required, with no parameter:
  #   mean net R > 0 in development and in validation;
  #   development total net R > 0 and at least its largest R drawdown.
  min_profitable_assets_development: 26 # assets with total net R > 0, out of 42 (60%, rounded up)
  min_trades_per_month_development: 1
  # Holdout, top-ranked qualifying version only: mean net R > 0 on at least this many
  # closed trades confirms it. Fewer trades: insufficient evidence. Otherwise: failed.
  # In both cases the choice stays open.
  min_closed_trades_holdout: 8
# Ranking of qualifying versions: the lower of the development and validation mean net R,
# highest first; ties by development total net R.
